<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña · Ride Bike</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#16a34a', 'primary-light': '#22c55e', 'background-dark': '#0a0a0a', 'background-card': '#141414' },
          fontFamily: { display: ['Bebas Neue'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="" class="bg-background-dark text-gray-200 font-sans">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">
      <a href="index.html" class="flex items-center gap-3 justify-center mb-8">
        <svg class="h-10 w-10 text-primary" viewBox="0 0 64 64" fill="none"><circle cx="16" cy="40" r="12" stroke="currentColor" stroke-width="3"/><circle cx="48" cy="40" r="12" stroke="currentColor" stroke-width="3"/><path d="M16 40 L26 22 L38 22 L48 40" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 22 L32 14 L40 14" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="18" r="2" fill="currentColor"/><path d="M48 40 L42 28" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
        <div>
          <h2 class="text-2xl font-bold text-white leading-none brand-title">RIDE BIKE</h2>
          <p class="text-[10px] uppercase tracking-[0.25em] text-primary/80 mt-1">Arriendo de Bicicletas</p>
        </div>
      </a>

      <div id="formBox" class="bg-background-card border border-gray-800 rounded-2xl p-8">
        <div class="text-center mb-8">
          <div class="h-14 w-14 mx-auto rounded-full bg-primary/15 border-2 border-primary/30 flex items-center justify-center mb-4">
            <svg class="h-7 w-7 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
          </div>
          <h2 class="brand-title text-3xl text-white mb-2">RECUPERAR CONTRASEÑA</h2>
          <p class="text-gray-400 text-sm">Te enviaremos un enlace para restablecer tu contraseña.</p>
        </div>

        <form id="recForm" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Email registrado</label>
            <input type="email" id="email" required class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" placeholder="tu@email.com"/>
          </div>
          <button type="submit" class="btn-primary w-full py-3">
            Enviar enlace de recuperación
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>
        </form>

        <p class="text-center text-sm text-gray-400 mt-6">
          <a href="inicio-sesion.html" class="text-primary hover:text-primary-light transition-colors flex items-center justify-center gap-2">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Volver a iniciar sesión
          </a>
        </p>
      </div>

      <div id="successBox" class="hidden bg-background-card border border-primary/30 rounded-2xl p-8 text-center">
        <div class="checkmark-circle mx-auto mb-6">
          <div class="background"></div>
          <div class="checkmark"></div>
        </div>
        <h2 class="brand-title text-3xl text-white mb-2">¡ENVIADO!</h2>
        <p class="text-gray-300 mb-6">Revisa tu bandeja de entrada. Te enviamos un enlace para restablecer tu contraseña.</p>
        <a href="inicio-sesion.html" class="btn-primary">Volver a iniciar sesión</a>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
  <script>
    function pageInit() {
      document.getElementById('recForm').addEventListener('submit', (e) => {
        e.preventDefault();
        UI.toast('Enlace enviado a tu correo');
        document.getElementById('formBox').classList.add('hidden');
        document.getElementById('successBox').classList.remove('hidden');
      });
    }
  </script>
</body>
</html>
