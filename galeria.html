<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería · Ride Bike</title>
  <meta name="description" content="Galería de fotos de nuestros paseos y aventuras en Lima." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#16a34a', 'primary-light': '#22c55e', 'background-dark': '#0a0a0a', 'background-card': '#141414' },
          fontFamily: { display: ['Bebas Neue'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="galeria" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main>
    <section class="py-20 border-b border-primary/10">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <p class="text-primary section-tag mb-3">Inspiración</p>
        <h1 class="text-6xl md:text-7xl font-bold text-white brand-title">GALERÍA</h1>
        <p class="text-gray-300 text-lg mt-4 max-w-2xl mx-auto">Revive los mejores paseos de nuestra comunidad de riders.</p>
      </div>
    </section>

    <section class="py-12 border-b border-primary/10">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap items-center justify-center gap-2" id="filterBar">
          <button class="filter-btn active px-5 py-2 rounded-full text-sm font-medium bg-primary text-black uppercase tracking-wider" data-filter="todas">Todas</button>
          <button class="filter-btn px-5 py-2 rounded-full text-sm font-medium bg-background-card border border-gray-700 text-gray-300 hover:border-primary uppercase tracking-wider" data-filter="ciudad">Ciudad</button>
          <button class="filter-btn px-5 py-2 rounded-full text-sm font-medium bg-background-card border border-gray-700 text-gray-300 hover:border-primary uppercase tracking-wider" data-filter="aventura">Aventura</button>
          <button class="filter-btn px-5 py-2 rounded-full text-sm font-medium bg-background-card border border-gray-700 text-gray-300 hover:border-primary uppercase tracking-wider" data-filter="familia">Familia</button>
          <button class="filter-btn px-5 py-2 rounded-full text-sm font-medium bg-background-card border border-gray-700 text-gray-300 hover:border-primary uppercase tracking-wider" data-filter="playa">Playa</button>
        </div>
      </div>
    </section>

    <section class="py-16">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div id="galeriaGrid" class="columns-1 sm:columns-2 lg:columns-3 gap-4 space-y-4"></div>
      </div>
    </section>

    <section class="py-16">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h2 class="text-4xl md:text-5xl font-bold text-white mb-4 brand-title">¿Te animas a rodar con nosotros?</h2>
        <p class="text-gray-300 mb-8 max-w-xl mx-auto">Reserva tu bici y agrega tus propias fotos a la galería.</p>
        <a href="reserva.html" class="btn-primary text-lg">Reservar ahora</a>
      </div>
    </section>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    function pageInit() {
      const items = [
        { src: 'https://images.unsplash.com/photo-1517649763962-0c623066013b?w=800&q=80', cat: 'ciudad' },
        { src: 'https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=800&q=80', cat: 'ciudad' },
        { src: 'https://images.unsplash.com/photo-1502744688674-c619d1586c9e?w=800&q=80', cat: 'playa' },
        { src: 'https://images.unsplash.com/photo-1606902965551-dce093cda6e7?w=800&q=80', cat: 'aventura' },
        { src: 'https://images.unsplash.com/photo-1559348349-86f1f65817fe?w=800&q=80', cat: 'ciudad' },
        { src: 'https://images.unsplash.com/photo-1576435728678-68d0fbf94e91?w=800&q=80', cat: 'aventura' },
        { src: 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=800&q=80', cat: 'aventura' },
        { src: 'https://images.unsplash.com/photo-1542652694-40abf526446e?w=800&q=80', cat: 'familia' },
        { src: 'https://images.unsplash.com/photo-1532298229144-0ec0c57515c7?w=800&q=80', cat: 'familia' },
        { src: 'https://images.unsplash.com/photo-1601758228041-f3b2795255f1?w=800&q=80', cat: 'playa' },
        { src: 'https://images.unsplash.com/photo-1606744837616-56c9a5c6a6eb?w=800&q=80', cat: 'ciudad' },
        { src: 'https://images.unsplash.com/photo-1534150034764-046bf225d3fa?w=800&q=80', cat: 'aventura' },
        { src: 'https://images.unsplash.com/photo-1593764592116-bfb2a97c642a?w=800&q=80', cat: 'ciudad' },
        { src: 'https://images.unsplash.com/photo-1473773508845-188df298d2d1?w=800&q=80', cat: 'playa' },
        { src: 'https://images.unsplash.com/photo-1571188654248-7a89213915f7?w=800&q=80', cat: 'familia' }
      ];

      const grid = document.getElementById('galeriaGrid');
      const filterBar = document.getElementById('filterBar');

      function render(filter = 'todas') {
        const list = filter === 'todas' ? items : items.filter(i => i.cat === filter);
        grid.innerHTML = list.map((it, idx) => `
          <div class="galeria-item break-inside-avoid mb-4" data-idx="${idx}">
            <img src="${it.src}" class="w-full object-cover" alt="Galería"/>
          </div>
        `).join('');
        grid.querySelectorAll('.galeria-item').forEach(el => {
          el.addEventListener('click', () => {
            const src = items[parseInt(el.dataset.idx)].src;
            const lb = document.createElement('div');
            lb.className = 'lightbox';
            lb.innerHTML = `<img src="${src.replace('w=800','w=1600')}" alt=""/><button class="absolute top-6 right-6 text-white bg-background-card/80 backdrop-blur p-3 rounded-full hover:bg-primary hover:text-black transition-colors"><svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>`;
            document.body.appendChild(lb);
            lb.addEventListener('click', (e) => {
              if (e.target.tagName === 'IMG' || e.target.closest('button')) return;
              lb.remove();
            });
            lb.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); lb.remove(); });
          });
        });
      }

      filterBar.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          filterBar.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('bg-primary', 'text-black');
            b.classList.add('bg-background-card', 'border', 'border-gray-700', 'text-gray-300');
          });
          btn.classList.add('bg-primary', 'text-black');
          btn.classList.remove('bg-background-card', 'border', 'border-gray-700', 'text-gray-300');
          render(btn.dataset.filter);
        });
      });

      render();
    }
  </script>
</body>
</html>
